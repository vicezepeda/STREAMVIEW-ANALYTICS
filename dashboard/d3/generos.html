<!doctype html><html lang="es"><meta charset="utf-8"><style>
body{font-family:Arial,sans-serif;margin:8px;color:#222}label{font-size:14px}select{margin-left:10px;padding:5px}svg{display:block;width:100%;height:auto}.tip{position:absolute;background:white;border:1px solid #aaa;padding:7px;display:none;pointer-events:none;font-size:13px}p{font-size:13px;color:#555}
</style><label>Comparar géneros por <select id="metric"><option value="titulos">Cantidad de títulos</option><option value="calificacion">Calificación promedio</option></select></label><svg viewBox="0 0 1000 440" role="img" aria-label="Comparación interactiva de géneros con D3"></svg><div class="tip"></div><p>Vista D3. Cambia la medida o pasa el cursor sobre una barra. Comparte los filtros de la barra lateral.</p><script>__D3_LIBRARY__</script><script>
const rows=__DATA__;const svg=d3.select('svg'),tip=d3.select('.tip');
function draw(){const metric=document.querySelector('#metric').value;const data=rows.filter(d=>d[metric]!==null).sort((a,b)=>b[metric]-a[metric]).slice(0,12).reverse();svg.selectAll('*').remove();const x=d3.scaleLinear().domain([0,metric==='calificacion'?10:(d3.max(data,d=>d[metric])||1)]).nice().range([200,930]);const y=d3.scaleBand().domain(data.map(d=>d.genero)).range([20,385]).padding(.25);svg.append('g').attr('transform','translate(0,390)').call(d3.axisBottom(x).ticks(6));svg.append('g').attr('transform','translate(195,0)').call(d3.axisLeft(y).tickSize(0));svg.selectAll('rect').data(data).join('rect').attr('x',200).attr('y',d=>y(d.genero)).attr('height',y.bandwidth()).attr('width',d=>x(d[metric])-200).attr('fill','#1f4e79').on('mouseover',function(e,d){d3.select(this).attr('fill','#f28e2b');tip.style('display','block').text(d.genero+': '+(metric==='titulos'?d[metric].toLocaleString('es-CL'):d[metric].toFixed(2)))}).on('mousemove',e=>tip.style('left',Math.min(e.pageX+8,730)+'px').style('top',e.pageY+10+'px')).on('mouseout',function(){d3.select(this).attr('fill','#1f4e79');tip.style('display','none')});svg.selectAll('.value').data(data).join('text').attr('class','value').attr('x',d=>x(d[metric])+5).attr('y',d=>y(d.genero)+y.bandwidth()/2+4).attr('font-size',12).text(d=>metric==='titulos'?d[metric].toLocaleString('es-CL'):d[metric].toFixed(2));}
document.querySelector('#metric').addEventListener('change',draw);draw();
</script></html>
